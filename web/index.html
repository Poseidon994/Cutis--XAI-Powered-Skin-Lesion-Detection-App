<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F2F4F6" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%238a93a8' stroke-width='2.5'/%3E%3Cpath d='M16 3a13 13 0 0 1 11.3 6.5' fill='none' stroke='%235a61c9' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%238a93a8'/%3E%3C/svg%3E" />
    <title>Cutis: skin lesion check</title>
    <script>
      // Sets the theme before first paint (no flash): an explicit choice in localStorage wins,
      // otherwise the OS preference. Mirrors web/src/theme.js, which keeps managing it afterwards.
      (function () {
        try {
          var saved = localStorage.getItem('cutis-theme');
          var dark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? 'dark' : 'light';
          root.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0f1523' : '#f2f4f6');
        } catch (e) { /* private mode / storage blocked: stay on the light theme */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
