# ---- adding more ----
# Open-access clinical guidelines would make the clinician library stronger than PDQ alone (for example the
# European consensus melanoma guideline, the British Association of Dermatologists guidelines for basal cell and
# cutaneous squamous cell carcinoma, and the ESMO melanoma guideline). Before adding one: find the current version,
# read its licence (many allow non-commercial reuse with credit but forbid changes), save the PDF into
# rag/corpus/manual/, then add an entry here with `file:` instead of `url:` and the licence copied from the PDF.
# Do not add NCCN guidelines, UpToDate, or society patient pages that carry "all rights reserved".
