# Every document the guideline library is built from.
#
#   id        S01, S02, ... (never reuse an id: it appears in stored reports)
#   audience  clinician | patient | both   (patients are only ever shown passages from patient/both sources)
#   topics    tags used to nudge retrieval: melanoma, bcc, scc, screening, prevention, diagnosis, symptoms, genetics
#   url       a page to download   |   file: a file you saved yourself into rag/corpus/manual/
#   selector  optional CSS selector for the main content, if a page comes out empty or full of menu text
#   enabled   false to leave a source out without deleting the entry
#
# Licences (checked October 2026; re-check before any public use):
#   NCI  - text is free of copyright, credit the National Cancer Institute: https://www.cancer.gov/policies/copyright-reuse
#   CDC  - most text is public domain, credit CDC, do not imply endorsement: https://www.cdc.gov/other/agencymaterials.html
# Graphics on these sites can be copyrighted by others; this library keeps text only.
# NCI also asks for a link to the original page under its original title, and reserves the NCI logo and the PDQ mark
# for unchanged NCI products: cite these pages by title, but never label Cutis's own text as PDQ.

sources:
